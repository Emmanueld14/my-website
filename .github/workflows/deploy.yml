name: Build and verify Pages site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # Production site is committed in /docs for legacy GitHub Pages
      # (Settings → Pages → Deploy from branch → main → /).
      - name: Verify docs build is committed
        run: |
          if [ ! -f docs/index.html ]; then
            echo "docs/index.html missing — run npm run build and commit docs/"
            exit 1
          fi
